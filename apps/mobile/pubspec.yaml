name: playlink
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  app_links: ^7.2.1
  clerk_auth: ^0.0.18-beta
  clerk_flutter: ^0.0.18-beta
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  # Snapshot de contenu v1 + GIF des règles, embarqués dans le binaire (§06).
  # Régénérés par scripts/build-snapshot.ts et scripts/fetch-assets.ts.
  assets:
    - assets/content/
